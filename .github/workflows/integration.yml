name: Integration

# End-to-end runs against GHCR and the Actions cache. Every state name is unique
# to the run and the cleanup job deletes the run's package versions. Jobs set
# allow-apply-from-any-ref so they also run on pull requests; the refs job
# checks the default without it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runs share the GHCR package and cache scope; let one finish before the next.
concurrency:
  group: integration
  cancel-in-progress: false

permissions:
  actions: write
  packages: write
  contents: read

env:
  TERRAFORM_VERSION: 1.16.5
  TOFU_VERSION: 1.13.1
  PREFIX: it-${{ github.run_id }}-${{ github.run_attempt }}
  # Test-only value: these states hold nothing but terraform_data and null_resource.
  PASSPHRASE: integration-test-passphrase
  FIXTURE: test/fixtures/data
  GH_TOKEN: ${{ github.token }}

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh ${{ matrix.tool }}
      - id: state
        uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-lifecycle-${{ matrix.tool }}
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
      - name: A new state has no outputs
        env:
          JSON: ${{ steps.state.outputs.json }}
        run: test "$JSON" = '{}'
      - name: First apply creates state
        working-directory: ${{ env.FIXTURE }}
        run: |
          ${{ matrix.tool }} init -input=false
          ${{ matrix.tool }} apply -auto-approve -input=false -var value=one
      - run: node test/scripts/inspect.js "$PREFIX-lifecycle-${{ matrix.tool }}" --expect-encrypted --min-serial 1

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    outputs:
      environments: ${{ steps.state.outputs.environments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh ${{ matrix.tool }}
      - name: Apply a provider-backed resource with a secret variable, in the action step
        id: state
        uses: ./
        env:
          TF_VAR_secret: ${{ secrets.SMOKE_SECRET }}
        with:
          working-directory: test/fixtures/null
          name: ${{ env.PREFIX }}-smoke-${{ matrix.tool }}
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
          run: |
            if [ -z "$TF_VAR_secret" ]; then
              echo "::error::the SMOKE_SECRET repository secret is not available to this run"
              exit 1
            fi
            if env | grep -q '^INPUT_'; then
              echo "::error::the action's inputs reached the run script"
              exit 1
            fi
            ${{ matrix.tool }} init -input=false
            ${{ matrix.tool }} apply -auto-approve -input=false
            ${{ matrix.tool }} state list | grep -qx null_resource.smoke
            ${{ matrix.tool }} plan -detailed-exitcode -input=false
            echo "from_script=yes" >> "$GITHUB_OUTPUT"
      - name: Outputs of the state after the run script are step outputs, and nested ones work with fromJSON
        env:
          SECRET: ${{ secrets.SMOKE_SECRET }}
          JSON: ${{ steps.state.outputs.json }}
          GREETING: ${{ steps.state.outputs.greeting }}
          SECRET_SHA: ${{ steps.state.outputs.secret_sha }}
          SENSITIVE: ${{ steps.state.outputs.sensitive }}
          SECRET_LEFT_OUT: ${{ steps.state.outputs.secret }}
          FROM_SCRIPT: ${{ steps.state.outputs.from_script }}
          PROD_TEAM: ${{ fromJSON(steps.state.outputs.environments).prod.tags.team }}
          DEV_REPLICAS: ${{ fromJSON(steps.state.outputs.environments).dev.replicas }}
          SECOND_ZONE: ${{ fromJSON(steps.state.outputs.subnets)[0].zones[1] }}
          FROM_JSON_REGION: ${{ fromJSON(steps.state.outputs.json).environments.dev.region }}
          FROM_JSON_GREETING: ${{ fromJSON(steps.state.outputs.json).greeting }}
        run: |
          test/scripts/check-outputs.sh "$JSON" "$SECRET"
          test "$GREETING" = hello
          test "$SECRET_SHA" = "$(printf %s "$SECRET" | sha256sum | cut -d' ' -f1)"
          test "$SENSITIVE" = '["secret"]'
          test -z "$SECRET_LEFT_OUT"
          test "$FROM_SCRIPT" = yes
          test "$PROD_TEAM" = core
          test "$DEV_REPLICAS" = 1
          test "$SECOND_ZONE" = b
          test "$FROM_JSON_REGION" = us-west-2
          test "$FROM_JSON_GREETING" = hello

  smoke-reload:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh ${{ matrix.tool }}
      - id: state
        uses: ./
        with:
          working-directory: test/fixtures/null
          name: ${{ env.PREFIX }}-smoke-${{ matrix.tool }}
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
          include-sensitive: true
      - name: A new job reads the outputs of the loaded state, sensitive ones included, and the job outputs
        env:
          SECRET: ${{ secrets.SMOKE_SECRET }}
          JSON: ${{ steps.state.outputs.json }}
          SECRET_INCLUDED: ${{ steps.state.outputs.secret }}
          SENSITIVE: ${{ steps.state.outputs.sensitive }}
          STATE_PROD_REGION: ${{ fromJSON(steps.state.outputs.environments).prod.region }}
          JOB_PROD_REPLICAS: ${{ fromJSON(needs.smoke.outputs.environments).prod.replicas }}
        run: |
          test "$SECRET_INCLUDED" = "$SECRET"
          test "$(jq -r .secret <<<"$JSON")" = "$SECRET"
          test "$SENSITIVE" = '["secret"]'
          test/scripts/check-outputs.sh "$(jq -c 'del(.secret)' <<<"$JSON")" "$SECRET"
          test "$STATE_PROD_REGION" = us-east-1
          test "$JOB_PROD_REPLICAS" = 3
      - name: Destroy empties the state
        working-directory: test/fixtures/null
        env:
          TF_VAR_secret: ${{ secrets.SMOKE_SECRET }}
        run: |
          ${{ matrix.tool }} init -input=false
          ${{ matrix.tool }} destroy -auto-approve -input=false
          if [ -n "$(${{ matrix.tool }} state list)" ]; then
            echo "::error::state still lists resources after destroy"
            exit 1
          fi
      - run: node test/scripts/inspect.js "$PREFIX-smoke-${{ matrix.tool }}" --expect-encrypted --min-serial 2

  run-fails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - id: failing
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-run-fails
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
          run: |
            terraform init -input=false
            touch "$RUNNER_TEMP/after-init"
            false | true
            touch "$RUNNER_TEMP/after-pipe"
      - name: A failing run script fails the step at the failing command
        env:
          OUTCOME: ${{ steps.failing.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -e "$RUNNER_TEMP/after-init"
          if [ -e "$RUNNER_TEMP/after-pipe" ]; then
            echo "::error::the script kept going after a failed pipeline"
            exit 1
          fi

  lifecycle-reload:
    needs: lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh ${{ matrix.tool }}
      - uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-lifecycle-${{ matrix.tool }}
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
      - name: A new job sees the saved state, then changes it
        working-directory: ${{ env.FIXTURE }}
        run: |
          ${{ matrix.tool }} init -input=false
          ${{ matrix.tool }} plan -detailed-exitcode -input=false -var value=one
          ${{ matrix.tool }} apply -auto-approve -input=false -var value=two
      - run: node test/scripts/inspect.js "$PREFIX-lifecycle-${{ matrix.tool }}" --expect-encrypted --min-serial 2

  wrong-passphrase:
    needs: lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: wrong
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-lifecycle-terraform
          passphrase: not-the-passphrase
          allow-apply-from-any-ref: true
      - name: The action must fail before Terraform runs
        run: |
          if [ "${{ steps.wrong.outcome }}" != failure ]; then
            echo "::error::a wrong passphrase was accepted"
            exit 1
          fi
          if ! grep -q 'decryption failed' "$RUNNER_TEMP"/actions-state/*.log; then
            echo "::error::the action failed, but not because decryption failed"
            exit 1
          fi

  public-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-guard
          allow-apply-from-any-ref: true
      - name: A public repo without a passphrase must be refused
        run: |
          if [ "${{ steps.guard.outcome }}" != failure ]; then
            echo "::error::state would have been stored unencrypted in a public package"
            exit 1
          fi
          if node test/scripts/inspect.js "$PREFIX-guard"; then
            echo "::error::the refused run stored state anyway"
            exit 1
          fi

  backend-conflict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - id: refused
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixtures/s3-backend
          name: ${{ env.PREFIX }}-conflict-refused
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
      - name: A declared backend must be refused by default
        run: |
          if [ "${{ steps.refused.outcome }}" != failure ]; then
            echo "::error::the s3 backend was silently replaced"
            exit 1
          fi
          if [ -e test/fixtures/s3-backend/actions_state_override.tf ]; then
            echo "::error::the refused run left an override file behind"
            exit 1
          fi
      - uses: ./
        with:
          working-directory: test/fixtures/s3-backend
          name: ${{ env.PREFIX }}-conflict-replaced
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
          replace-backend: true
      - name: replace-backend overrides it without touching AWS
        working-directory: test/fixtures/s3-backend
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

  contention-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-contention
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
      - working-directory: ${{ env.FIXTURE }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var value=seed

  contention:
    needs: contention-seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-contention
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
      - name: Concurrent applies take turns
        working-directory: ${{ env.FIXTURE }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var value=n${{ matrix.n }} -var sleep=10

  contention-verify:
    needs: contention
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node test/scripts/inspect.js "$PREFIX-contention" --expect-encrypted --min-serial 4

  fail-fast-holder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-failfast
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
      - name: Create state, then hold the lock for two minutes
        working-directory: ${{ env.FIXTURE }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var value=a
          terraform apply -auto-approve -input=false -var value=b -var sleep=120

  fail-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - name: Wait for the holder's first version, then for it to take the lock
        run: |
          node test/scripts/inspect.js "$PREFIX-failfast" --wait 600
          sleep 30
      - uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-failfast
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
          lock-timeout: 0
      - id: apply
        continue-on-error: true
        working-directory: ${{ env.FIXTURE }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var value=c 2>&1 | tee "$RUNNER_TEMP/apply.log"
          exit "${PIPESTATUS[0]}"
      - name: The second apply fails at once with the holder's lock info
        run: |
          [ "${{ steps.apply.outcome }}" = failure ]
          grep -q 'Lock Info' "$RUNNER_TEMP/apply.log"

  crash-holder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-crash
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
      # Deleting the runfile leaves the post step nothing to release, so the
      # job ends holding the lock.
      - name: Create state, take the lock, then crash the server
        working-directory: ${{ env.FIXTURE }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var value=a
          terraform apply -auto-approve -input=false -var value=b -var sleep=600 &
          sleep 30
          runfile=$(ls "$RUNNER_TEMP"/actions-state/*.json)
          kill -9 "$(jq -r .pid "$runfile")"
          pkill -9 -f 'terraform apply' || true
          rm -f "$runfile"

  crash-waiter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - name: Wait for the holder's first version, then for it to take the lock
        run: |
          node test/scripts/inspect.js "$PREFIX-crash" --wait 600
          sleep 30
      - uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-crash
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
          lock-timeout: 900
      - name: The abandoned lock is reclaimed and the apply goes through
        working-directory: ${{ env.FIXTURE }}
        run: |
          terraform init -input=false
          start=$(date +%s)
          terraform apply -auto-approve -input=false -var value=c
          echo "waited and applied in $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! grep -q 'ended without releasing; reclaiming' "$RUNNER_TEMP"/actions-state/*.log; then
            echo "::error::the lock was not reclaimed from the crashed holder"
            exit 1
          fi

  stale-save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - id: state
        uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-stale
          passphrase: ${{ env.PASSPHRASE }}
          allow-apply-from-any-ref: true
      - working-directory: ${{ env.FIXTURE }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var value=a
      - id: apply
        continue-on-error: true
        working-directory: ${{ env.FIXTURE }}
        run: |
          (sleep 8 && node "$GITHUB_WORKSPACE/test/scripts/push-direct.js" "$PREFIX-stale") &
          terraform apply -auto-approve -input=false -var value=b -var sleep=25 2>&1 | tee "$RUNNER_TEMP/apply.log"
          exit "${PIPESTATUS[0]}"
      - name: The save is refused because a newer version appeared
        run: |
          [ "${{ steps.apply.outcome }}" = failure ]
          grep -q 'HTTP error: 409' "$RUNNER_TEMP/apply.log"
          grep -q 'state changed since it was loaded' "$RUNNER_TEMP"/actions-state/*.log

  refs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/scripts/install-tool.sh terraform
      - uses: ./
        with:
          working-directory: ${{ env.FIXTURE }}
          name: ${{ env.PREFIX }}-refs
          passphrase: ${{ env.PASSPHRASE }}
      - name: A pull request may plan
        working-directory: ${{ env.FIXTURE }}
        run: |
          terraform init -input=false
          terraform plan -input=false
      - id: apply
        continue-on-error: true
        working-directory: ${{ env.FIXTURE }}
        run: |
          terraform apply -auto-approve -input=false 2>&1 | tee "$RUNNER_TEMP/apply.log"
          exit "${PIPESTATUS[0]}"
      - name: But may not apply
        run: |
          [ "${{ steps.apply.outcome }}" = failure ]
          grep -q 'may only plan' "$RUNNER_TEMP/apply.log"

  cleanup:
    needs: [smoke-reload, run-fails, lifecycle-reload, wrong-passphrase, public-guard, backend-conflict, contention-verify, fail-fast, fail-fast-holder, crash-holder, crash-waiter, stale-save, refs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node test/scripts/cleanup.js "$PREFIX-"
